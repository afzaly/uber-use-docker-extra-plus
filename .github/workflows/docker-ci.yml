name: Docker CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    env:
      POSTGRES_DB: georide
      POSTGRES_USER: georide
      POSTGRES_PASSWORD: ci-test-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build application images
        run: docker compose build api location matcher simulator-alpha

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push images to Docker Hub
        if: github.event_name == 'push'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          for service in api location matcher simulator-alpha; do
            source_image="uber-use-docker-extra-plus-${service}:latest"
            target_image="${DOCKERHUB_USERNAME}/uber-use-docker-extra-plus-${service}:latest"
            docker tag "$source_image" "$target_image"
            docker push "$target_image"
          done
